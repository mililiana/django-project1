
{% load static %}

{% block content %}
    <link href="{% static 'css/login.css' %}" rel="stylesheet">

    <h1>Log-in</h1>
    <p>Please use the following form to log-in:</p>
    <form id="login-form" method="post">
        {{ form.as_p }}
        {% csrf_token %}
        <p><input type="submit" value="Log in"></p>
    </form>

    <div id="login-messages"></div>
{% endblock %}


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    $(document).on('submit', '#login-form', function(e) {
        e.preventDefault();

        var formData = $(this).serialize();

        $.ajax({
            type: 'POST',
            url: $(this).attr('action'),
            data: formData,
            success: function(data) {
                if (data.trim() === 'The authentication was successful!') {
                    $('#login-result').text('Login successful!').css('color', 'green');
                } else {
                    $('#login-result').text('Invalid login credentials').css('color', 'red');
                }
                $('#loginModal').modal('show');
            },
            error: function(xhr, status, error) {
                console.error('Error occurred during login:', error);
                $('#login-result').text('Error occurred. Please try again.').css('color', 'red');
                $('#loginModal').modal('show');
            }
        });
    });
</script>



<div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel">Результат автентифікації</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p id="login-result"></p>
      </div>
    </div>
  </div>
</div>
