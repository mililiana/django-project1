<!-- templates/item_detail.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.name }} Details</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        main {
            text-align: center;
            margin: 20px;
        }

        .item-container {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        .item-price,
        .item-size,
        .item-color {
            display: block;
            margin-bottom: 10px;
        }

        .item-price {
            color: #333;
            font-weight: bold;
        }

        .item-size,
        .item-color {
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>{{ item.name }} Details</h1>
    </header>

    <main>
        <div class="item-container">
            <h2>{{ item.name }}</h2>
            <p>{{ item.description }}</p>
            <span class="item-price">Price: ${{ item.price }}</span>
            <span class="item-size">Size: {{ item.size }}</span>
            <span class="item-color">Color: {{ item.color }}</span>
        </div>
    </main>

</body>
</html>
