<!-- templates/items_list.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items List</title>
    <style>

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        main {
            text-align: center;
            margin: 20px;
        }

        div.item-container {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
        }

        p {
            color: #666;
        }

        a.details-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            margin-top: 5px;
            display: block;
        }
    </style>

</head>
<body>

     <main>

         <header>
        <h1>Items List</h1>
        </header>
        {% for item in items %}
                 <div class="item-container">
                      <h2>{{ item.name }}</h2>
                      <p>{{ item.description }}</p>
                      <a href="{% url 'item_detail' item.id %}" class="details-link">View Details</a>
                </div>
            {% endfor %}

    </main>
    <ul id="display"></ul>

</body>
</html>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    $(document).ready(function (){
    setInterval(function(){
        $.ajax({
            type: 'GET',
            url: "{% url 'items_list' %}",
            success: function(response){
                $('main').html(response);
            },
            error: function(response){
                alert("Сталася помилка!");
            }
        });
    }, 1000);
});

</script>
