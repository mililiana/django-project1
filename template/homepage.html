<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Shop</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        main {
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #fff;
        }

        p {
            color: #555
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Our Store!</h1>
        <p style="text-transform: uppercase; font-size: 20px;">Choosing us is always a good decision</p>
    </header>

    <main>
        <a href="{% url 'users_list' %}" class="button">View Customers</a>
        <a href="{% url 'items_list' %}" class="button">View Items</a>


    </main>


</body>
</html>
