<!-- templates/users_list.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #fff;
        }

        main {
            text-align: center;
            margin-top: 20px;
        }

        p {
            background-color: #fff;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>List of our customers!</h1>
    </header>

     <main>
        {% for user in users %}
            <p>
                <a href="{% url 'user_orders' id=user.id %}">{{ user.name }}  {{ user.surname }}</a>
            </p>
        {% endfor %}
    </main>

</body>
</html>
